apiVersion: v1
kind: Secret
metadata:
 name: mysql
 namespace: roboshop
 labels:
    project: roboshop
    tier: db
    component: mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "RoboShop@1"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: db
spec:
  ports:
   - protocol: TCP
     port: 3306 # service port
     targetPort: 3306 # container port
  clusterIP: None # headless service
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
spec:
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: db                # has to match .spec.template.metadata.labels
  serviceName: "mysql-headless"
  replicas: 1  
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
        tier: db              #has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: mysql
        image: srikanth865/mysql:v1
        envFrom:
         - secretRef:
            name: mysql
        volumeMounts:
        - name: www
          mountPath: /var/lib/mysql
  # PVC
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi
